name: CI

# DriverTrax is a no-build, plain HTML/CSS/JS PWA — that stays true: nothing
# here compiles, bundles, or transforms the app, and no node_modules is
# committed or installed into the repo.
#
# CI does more than parse, though. `node --check` only catches syntax errors,
# which meant a typo'd cross-file call or a script missing from the service
# worker's precache list shipped clean. The lint step fetches a pinned ESLint
# on demand (npx, nothing written to the repo) and the precache step is plain
# Node with no dependencies at all.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: JavaScript syntax check
        run: |
          shopt -s nullglob
          files=(*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .js files found" >&2
            exit 1
          fi
          echo "Checking ${#files[@]} JavaScript file(s) with 'node --check'..."
          status=0
          for f in "${files[@]}"; do
            if node --check "$f"; then
              echo "  ok   $f"
            else
              echo "  FAIL $f"
              status=1
            fi
          done
          exit $status

      # Pinned so a new ESLint release can't turn the build red on its own.
      # Keep in step with the eslint devDependency in package.json.
      - name: Lint
        run: npx --yes eslint@9.39.5 .

      - name: Service worker precaches everything index.html loads
        run: node scripts/check-precache.mjs

      - name: No merge-conflict markers
        run: |
          if grep -rEn '^(<{7}|={7}|>{7})( |$)' \
               --include='*.js' --include='*.css' --include='*.html' --include='*.sql' .; then
            echo "Merge-conflict markers found (see above)." >&2
            exit 1
          fi
          echo "No merge-conflict markers."

      - name: Service worker cache version is set
        run: |
          if ! grep -qE 'const CACHE_VERSION = "[^"]+";' sw.js; then
            echo "sw.js is missing a CACHE_VERSION constant." >&2
            exit 1
          fi
          grep -E 'const CACHE_VERSION = "[^"]+";' sw.js
