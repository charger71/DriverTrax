<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backlot — Parking Sections</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --ink: #14181c;
    --paper: #f5f3ee;
    --line: #d8d4c8;
    --accent: #ff6a2b;
    --ok: #2f7a4f;
    --warn: #b7791f;
    --mono: 'SF Mono', 'JetBrains Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); }

  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 14px 18px; border-bottom: 2px solid var(--ink);
    background: var(--paper);
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 0.02em; }
  header h1 span { color: var(--accent); }
  header .meta { font-family: var(--mono); font-size: 11px; color: #6b6558; }

  #main { flex: 1; display: flex; min-height: 0; }

  #map { flex: 1; min-width: 0; }

  #panel {
    width: 300px; flex-shrink: 0; overflow-y: auto;
    border-left: 2px solid var(--ink); background: var(--paper);
  }
  .section-item {
    padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
    transition: background 0.12s;
  }
  .section-item:hover { background: #ece8dd; }
  .section-item.active { background: var(--ink); color: var(--paper); }
  .section-item .name { font-weight: 600; font-size: 13px; }
  .section-item .stats {
    font-family: var(--mono); font-size: 11px; margin-top: 3px;
    color: #6b6558;
  }
  .section-item.active .stats { color: #cfc9ba; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

  #coords-box {
    padding: 12px 16px; border-top: 2px solid var(--ink);
    font-family: var(--mono); font-size: 10.5px; color: #6b6558; line-height: 1.5;
  }
  #coords-box strong { color: var(--ink); display: block; margin-bottom: 8px; font-size: 11px; }
  .export-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tab-btn {
    font-family: inherit; font-size: 10.5px; padding: 3px 8px;
    border: 1px solid var(--line); background: var(--paper); color: #6b6558;
    cursor: pointer; border-radius: 2px;
  }
  .tab-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  #coords-text {
    margin: 0; white-space: pre-wrap; word-break: break-all; max-height: 220px;
    overflow-y: auto; background: #ece8dd; padding: 8px; border-radius: 2px;
  }
  #copy-btn {
    margin-top: 8px; font-family: inherit; font-size: 11px; padding: 5px 10px;
    border: 1px solid var(--ink); background: var(--paper); color: var(--ink);
    cursor: pointer; border-radius: 2px; width: 100%;
  }
  #copy-btn:hover { background: var(--ink); color: var(--paper); }
  #copy-btn.copied { background: var(--ok); color: var(--paper); border-color: var(--ok); }

  /* "Retag drop-offs" utility — sits below the export box.
     Copies the SQL that re-runs the point-in-polygon match against
     historical drop_offs (needed after adding or moving a polygon). */
  #retag-box {
    padding: 12px 16px; border-top: 2px solid var(--ink);
    font-family: var(--mono); font-size: 10.5px; color: #6b6558; line-height: 1.5;
  }
  #retag-box strong { color: var(--ink); display: block; margin-bottom: 4px; font-size: 11px; }
  #retag-box p { margin: 0 0 8px; }
  #retag-btn {
    font-family: inherit; font-size: 11px; padding: 5px 10px;
    border: 1px solid var(--ink); background: var(--paper); color: var(--ink);
    cursor: pointer; border-radius: 2px; width: 100%;
  }
  #retag-btn:hover { background: var(--ink); color: var(--paper); }
  #retag-btn.copied { background: var(--ok); color: var(--paper); border-color: var(--ok); }

  .leaflet-popup-content-wrapper { border-radius: 2px; font-family: -apple-system, sans-serif; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Backlot<span>·</span>Parking Sections</h1>
    <div class="meta" id="header-meta">— lot boundaries</div>
  </header>
  <div id="main">
    <div id="map"></div>
    <div id="panel">
      <div id="section-list"></div>
      <div id="coords-box">
        <strong>Selected section — export boundary</strong>
        <div class="export-tabs">
          <button class="tab-btn active" data-fmt="geojson">GeoJSON</button>
          <button class="tab-btn" data-fmt="sql">SQL insert</button>
        </div>
        <pre id="coords-text">Click a section on the map or list.</pre>
        <button id="copy-btn" style="display:none;">Copy</button>
      </div>
      <div id="retag-box">
        <strong>Retag historical drop-offs</strong>
        <p>Run after adding or moving a polygon. Re-checks every drop-off's GPS against the current sections and writes back to <code>records</code>. Idempotent.</p>
        <button id="retag-btn">Copy retag SQL</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------------------------------------------------------
   DATA: each parking section is a polygon of [lat, lng] pairs.
   Replace with real coordinates for your lot(s) — capture them
   by walking the perimeter with a GPS app, or by clicking
   points on Google Maps / Google Earth and copying lat,lng.
   status: 'open' | 'full' | 'restricted'
--------------------------------------------------------- */
const sections = [
  {
    id: "GARAGE-LOU",
    name: "Garage",
    capacity: 400,
    occupied: 0,
    status: "open",
    coords: [
      [38.18785886128828, -85.74231944807806],
      [38.1882155180886, -85.74150768412079],
      [38.18729739027802, -85.74083871795214],
      [38.18692564836675, -85.74166533545488]
    ]
  },
  {
    id: "RETURNS-LOU",
    name: "Returns",
    capacity: 100,
    occupied: 0,
    status: "open",
    coords: [
      [38.18757923487743, -85.74293115590422],
      [38.18785886128828, -85.74231944807806],
      [38.18692564836675, -85.74166533545488],
      [38.18665428945734, -85.74228471405515]
    ]
  },
  {
    id: "QTA-LOU",
    name: "QTA",
    capacity: 300,
    occupied: 0,
    status: "open",
    coords: [
      [38.18514126468124, -85.74502123917335],
      [38.18542880962902, -85.74439718311915],
      [38.18390649994551, -85.7433283974631],
      [38.18363586378256, -85.74396679963348]
    ]
  },
  {
    id: "BLOT-LOU",
    name: "Back Lot",
    capacity: 400,
    occupied: 0,
    status: "open",
    coords: [
      [38.193960328564074, -85.75541612174744],
      [38.19424966878994, -85.75375373309824],
      [38.194091575819286, -85.75374614228248],
      [38.19398120882505, -85.75450901926534],
      [38.192331649763354, -85.75407254735973],
      [38.19231673495401, -85.75453558712046],
      [38.192379377132674, -85.75478228863233],
      [38.19239130897013, -85.75478987944808],
      [38.19254343972621, -85.75500242228907],
      [38.19274329729535, -85.75511248911745],
      [38.19274628024001, -85.75510869370957]
    ]
      },
  {
    id: "OLOT-LOU",
    name: "Orange Lot",
    capacity: 200,
    occupied: 0,
    status: "open",
    coords: [
      [38.19398120882505, -85.75450901926534],
      [38.194091575819286, -85.75374614228248],
      [38.1940557811368, -85.75359432596748],
      [38.19333093503054, -85.75359432596748],
      [38.19333690087156, -85.75376132391398],
      [38.19232866680172, -85.75373096065098],
      [38.192331649763354, -85.75407254735973]
    ]
      },
  {
    id: "PA-ATLANTIC-LOU",
    name: "Atlantic/FOB",
    capacity: 20,
    occupied: 0,
    status: "open",
    coords: [
      [38.185481485025186, -85.72552918940946],
      [38.18469987139997, -85.72473594916362],
      [38.184013715122106, -85.72618579497181],
      [38.184088297639256, -85.72707771582243],
      [38.18417481326354, -85.72732821274215],
      [38.18435381078064, -85.7274420749784],
      [38.18471777104247, -85.72738514386027],
      [38.18497134883866, -85.72696385358618],
      [38.18505488015472, -85.72628068016868],
      [38.18534127251119, -85.72577209551346]
    ]
      },
  {
    id: "HS-2F3GJ7",
    name: "Preston North 2F3GJ7",
    capacity: 40,
    occupied: 0,
    status: "open",
    coords: [
      [38.18613541080047, -85.72395350904064],
      [38.18647208928971, -85.72321772876019],
      [38.186162562349224, -85.72301046670937],
      [38.185779724577166, -85.72368061400704]
    ]
      },
  {
    id: "TEST71",
    name: "AREA71",
    capacity: 1000,
    occupied: 0,
    status: "restricted",
    coords: [
      [38.194468759237076, -85.71734727462919],
      [38.19584511752505, -85.71546988702076],
      [38.19467246190378, -85.7144401259072],
      [38.19364843732534, -85.71632451869326]
    ]
  }
];

const statusColor = { open: "#2f7a4f", full: "#b7791f", restricted: "#a33636" };

// ---- Map setup ----
const map = L.map('map', { zoomControl: true }).setView([38.2532, -85.7580], 17);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 20,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const layers = {};
const listEl = document.getElementById('section-list');
const coordsText = document.getElementById('coords-text');
const copyBtn = document.getElementById('copy-btn');
const headerMeta = document.getElementById('header-meta');

let activeId = null;
let activeFmt = 'geojson';

// Closes the ring (first point = last point) as PostGIS/GeoJSON require.
function closedRing(coords) {
  const ring = coords.map(c => [c[1], c[0]]); // [lng, lat] for GeoJSON
  const first = ring[0], last = ring[ring.length - 1];
  if (first[0] !== last[0] || first[1] !== last[1]) ring.push(first);
  return ring;
}

function toGeoJSON(s) {
  const geojson = {
    type: "Feature",
    properties: { name: s.name, status: s.status, capacity: s.capacity },
    geometry: { type: "Polygon", coordinates: [closedRing(s.coords)] }
  };
  return JSON.stringify(geojson, null, 2);
}

function toSQL(s) {
  const wkt = closedRing(s.coords).map(([lng, lat]) => `${lng} ${lat}`).join(', ');
  return `insert into parking_sections (fleet_id, name, status, boundary)
values (
  :fleet_id,
  '${s.name.replace(/'/g, "''")}',
  '${s.status}',
  ST_GeogFromText('POLYGON((${wkt}))')
);`;
}

function renderExport() {
  if (!activeId) return;
  const s = sections.find(s => s.id === activeId);
  coordsText.textContent = activeFmt === 'geojson' ? toGeoJSON(s) : toSQL(s);
  copyBtn.style.display = 'block';
  copyBtn.textContent = 'Copy';
  copyBtn.classList.remove('copied');
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFmt = btn.dataset.fmt;
    renderExport();
  });
});

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(coordsText.textContent).then(() => {
    copyBtn.textContent = 'Copied ✓';
    copyBtn.classList.add('copied');
  });
});

// Retag helper — copies the RPC call so you can paste it into the
// Supabase SQL editor. Function itself lives in parking-sections-schema.sql.
const retagBtn = document.getElementById('retag-btn');
const retagSql = 'select public.retag_drop_offs() as newly_tagged;';
retagBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(retagSql).then(() => {
    retagBtn.textContent = 'Copied ✓';
    retagBtn.classList.add('copied');
    setTimeout(() => {
      retagBtn.textContent = 'Copy retag SQL';
      retagBtn.classList.remove('copied');
    }, 1600);
  });
});

function selectSection(id) {
  document.querySelectorAll('.section-item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  Object.entries(layers).forEach(([sid, layer]) => {
    layer.setStyle({ weight: sid === id ? 3 : 2, fillOpacity: sid === id ? 0.45 : 0.25 });
  });
  activeId = id;
  renderExport();
  map.fitBounds(layers[id].getBounds(), { padding: [40, 40] });
}

sections.forEach(s => {
  const poly = L.polygon(s.coords, {
    color: statusColor[s.status],
    fillColor: statusColor[s.status],
    fillOpacity: 0.25,
    weight: 2
  }).addTo(map);

  poly.bindPopup(`<strong>${s.name}</strong><br>${s.occupied}/${s.capacity} occupied — ${s.status}`);
  poly.on('click', () => selectSection(s.id));
  layers[s.id] = poly;

  const item = document.createElement('div');
  item.className = 'section-item';
  item.dataset.id = s.id;
  item.innerHTML = `
    <div class="name"><span class="dot" style="background:${statusColor[s.status]}"></span>${s.name}</div>
    <div class="stats">${s.occupied}/${s.capacity} spaces · ${s.status}</div>
  `;
  item.addEventListener('click', () => selectSection(s.id));
  listEl.appendChild(item);
});

const totalCap = sections.reduce((a, s) => a + s.capacity, 0);
const totalOcc = sections.reduce((a, s) => a + s.occupied, 0);
headerMeta.textContent = `${sections.length} sections · ${totalOcc}/${totalCap} occupied`;

// Fit map to all sections on load
const allBounds = L.latLngBounds(sections.flatMap(s => s.coords));
map.fitBounds(allBounds, { padding: [40, 40] });
</script>
</body>
</html>
