<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https://cdn.jsdelivr.net https://wcetkygfsstqtlmrijjl.supabase.co wss://wcetkygfsstqtlmrijjl.supabase.co; font-src 'self' data:; object-src 'none'; base-uri 'self'">
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Backlot" />
<meta name="theme-color" content="#0f1216" />
<title>Backlot — DriverTrax</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon.png">
<link rel="manifest" href="backlot-manifest.json">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

<style>
  :root {
    --bg: #0f1216;
    --panel: #181c22;
    --panel2: #20252c;
    --line: #2a313a;
    --text: #e8eaed;
    --text2: #b0b8c1;
    --muted: #6b7785;
    --accent: #00a651;
    --warn: #f0b429;
    --danger: #e85550;
    --info: #4a9eff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ---- top bar ---- */
  .topbar {
    background: #0b0d10; border-bottom: 2px solid var(--accent);
    display: flex; align-items: center; padding: 12px 16px; gap: 12px;
    position: sticky; top: 0; z-index: 50;
  }
  .brand { font-weight: 900; letter-spacing: 2px; color: var(--accent); font-size: 16px; }
  .brand small { color: var(--muted); font-weight: 600; letter-spacing: 1px; margin-left: 4px; font-size: 10px; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .pill {
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 10px; font-size: 11px; color: var(--text2);
  }
  .pill .dot { display: inline-block; width: 6px; height: 6px; border-radius: 999px; background: var(--accent); margin-right: 5px; vertical-align: 1px; }
  .signout-btn {
    background: none; border: 1px solid var(--line); color: var(--text2);
    padding: 5px 10px; border-radius: 6px; font-size: 11px; cursor: pointer;
  }

  /* ---- tab strip ---- */
  .tabs {
    display: flex; background: #0b0d10; border-bottom: 1px solid var(--line);
    overflow-x: auto;
  }
  .tab {
    flex: 1; min-width: 80px; padding: 12px 8px; text-align: center;
    background: none; border: none; color: var(--text2);
    font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
    cursor: pointer; border-bottom: 2px solid transparent;
    text-transform: uppercase;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ---- main ---- */
  main { flex: 1; padding: 14px; overflow-y: auto; }
  .view { display: none; }
  .view.active { display: block; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 12px;
  }
  .card h3 {
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px; font-weight: 700;
  }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat {
    background: var(--panel2); border-radius: 10px; padding: 12px;
  }
  .stat .lbl { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .stat .val { font-size: 26px; font-weight: 900; color: var(--text); margin-top: 4px; }
  .stat .sub { font-size: 11px; color: var(--text2); margin-top: 2px; }

  .breakdown { display: flex; flex-direction: column; gap: 6px; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .bar-row .label { width: 90px; color: var(--text2); }
  .bar-row .bar {
    flex: 1; height: 8px; background: var(--panel2); border-radius: 999px; overflow: hidden;
  }
  .bar-row .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .bar-row .count { width: 28px; text-align: right; color: var(--text); font-weight: 700; }

  .leader-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .leader-row:last-child { border-bottom: none; }
  .leader-rank {
    width: 26px; height: 26px; border-radius: 50%; background: var(--panel2);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 12px; color: var(--text2);
  }
  .leader-rank.gold { background: #5a4310; color: #f0b429; }
  .leader-name { flex: 1; font-weight: 600; }
  .leader-count { font-weight: 900; color: var(--accent); font-size: 16px; }
  .leader-sub { font-size: 11px; color: var(--muted); }

  #map { width: 100%; height: calc(100vh - 220px); min-height: 320px; border-radius: 12px; border: 1px solid var(--line); }

  .ann-form { display: flex; flex-direction: column; gap: 10px; }
  .ann-form textarea, .ann-form input, .ann-form select {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    font-size: 14px; font-family: inherit;
  }
  .ann-form textarea { min-height: 70px; resize: vertical; }
  .ann-form button {
    background: var(--accent); color: #fff; border: none; padding: 12px;
    border-radius: 8px; font-weight: 800; font-size: 14px; cursor: pointer;
  }
  .ann-list .ann-item {
    background: var(--panel2); border-radius: 8px; padding: 10px 12px; margin-top: 8px;
    border-left: 3px solid var(--accent);
  }
  .ann-item .meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .ann-item .body { font-size: 13px; color: var(--text); white-space: pre-wrap; }
  .ann-item .del {
    float: right; background: none; border: none; color: var(--danger);
    font-size: 11px; cursor: pointer;
  }
  .edr-item {
    background: var(--panel2); border-radius: 8px; padding: 10px 12px; margin-top: 8px;
  }
  .edr-item .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); }
  .edr-item .status { font-weight: 700; color: var(--accent); }
  .edr-item .responses { margin-top: 6px; font-size: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 20px; font-size: 13px; }

  /* ---- gate (not signed in / not manager) ---- */
  #gate {
    position: fixed; inset: 0; background: var(--bg);
    display: none; align-items: center; justify-content: center; padding: 20px;
    z-index: 100;
  }
  #gate.show { display: flex; }
  .gate-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 24px 20px; max-width: 360px; width: 100%; text-align: center;
  }
  .gate-card h2 { color: var(--accent); letter-spacing: 3px; font-size: 18px; margin-bottom: 14px; }
  .gate-form { display: flex; flex-direction: column; gap: 10px; text-align: left; }
  .gate-form input {
    padding: 10px 12px; border-radius: 8px;
    background: #0f1216; color: var(--text); border: 1px solid var(--line);
    font-size: 15px;
  }
  .gate-form button {
    background: var(--accent); color: #fff; border: none; padding: 12px;
    border-radius: 8px; font-weight: 800; font-size: 15px; cursor: pointer;
  }
  .gate-msg { margin-top: 10px; font-size: 13px; min-height: 16px; color: var(--text2); }
  .gate-msg.err { color: var(--danger); }
  .gate-deny { color: var(--text2); font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

<!-- Auth + role gate -->
<div id="gate">
  <div class="gate-card">
    <h2>BACKLOT</h2>
    <div id="gateContent"></div>
  </div>
</div>

<header class="topbar">
  <div class="brand">BACKLOT <small>MANAGER</small></div>
  <div class="top-right">
    <div class="pill"><span class="dot"></span><span id="liveLabel">live</span></div>
    <button class="signout-btn" id="signOutBtn">Sign out</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-view="stats">Stats</button>
  <button class="tab" data-view="leaderboard">Leaders</button>
  <button class="tab" data-view="map">Map</button>
  <button class="tab" data-view="announce">Posts</button>
</nav>

<main>
  <!-- STATS -->
  <section class="view active" id="view-stats">
    <div class="card">
      <h3>Today's Fleet</h3>
      <div class="stat-grid">
        <div class="stat"><div class="lbl">Cars logged</div><div class="val" id="statCars">—</div><div class="sub" id="statCarsSub"></div></div>
        <div class="stat"><div class="lbl">Active drivers</div><div class="val" id="statDrivers">—</div><div class="sub" id="statDriversSub"></div></div>
        <div class="stat"><div class="lbl">No Tag</div><div class="val" id="statNoTag">—</div><div class="sub" id="statNoTagSub"></div></div>
        <div class="stat"><div class="lbl">Cars / hour</div><div class="val" id="statRate">—</div><div class="sub">today, fleet-wide</div></div>
      </div>
    </div>
    <div class="card">
      <h3>Status breakdown</h3>
      <div class="breakdown" id="statusBreakdown"><div class="empty">Loading…</div></div>
    </div>
  </section>

  <!-- LEADERBOARD -->
  <section class="view" id="view-leaderboard">
    <div class="card">
      <h3>Today's leaders</h3>
      <div id="leaderboard"><div class="empty">Loading…</div></div>
    </div>
  </section>

  <!-- MAP -->
  <section class="view" id="view-map">
    <div class="card">
      <h3>Today's activity</h3>
      <div id="map"></div>
    </div>
  </section>

  <!-- ANNOUNCEMENTS + EXTRA DRIVER REQUEST -->
  <section class="view" id="view-announce">
    <div class="card">
      <h3>Post announcement</h3>
      <form class="ann-form" id="annForm">
        <textarea name="body" placeholder="Type a message visible to all drivers…" required maxlength="500"></textarea>
        <button type="submit">Post</button>
      </form>
    </div>
    <div class="card">
      <h3>Recent announcements</h3>
      <div class="ann-list" id="annList"><div class="empty">Loading…</div></div>
    </div>

    <div class="card">
      <h3>Request extra drivers</h3>
      <form class="ann-form" id="edrForm">
        <input type="datetime-local" name="shift_time" required>
        <input type="number" name="needed_count" min="1" max="20" value="1" required>
        <input type="number" name="duration_minutes" min="30" max="720" placeholder="Duration in minutes (optional)">
        <textarea name="note" placeholder="Note (incentive, location, etc.)" maxlength="200"></textarea>
        <button type="submit">Send request</button>
      </form>
    </div>
    <div class="card">
      <h3>Open requests</h3>
      <div id="edrList"><div class="empty">Loading…</div></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script>
(function () {
  const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true }
  });

  const $ = (id) => document.getElementById(id);
  const gate = $("gate");
  const gateContent = $("gateContent");

  function showSignIn(msg) {
    gateContent.innerHTML = `
      <form class="gate-form" id="gateForm">
        <input type="email" name="email" placeholder="Email" autocomplete="email" required>
        <input type="password" name="password" placeholder="Password" autocomplete="current-password" required minlength="6">
        <button type="submit">Sign in</button>
      </form>
      <div class="gate-msg ${msg && msg.kind === 'err' ? 'err' : ''}" id="gateMsg">${(msg && msg.text) || ''}</div>
    `;
    $("gateForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      $("gateMsg").textContent = "Signing in…";
      $("gateMsg").className = "gate-msg";
      const { error } = await sb.auth.signInWithPassword({
        email: fd.get("email").trim(),
        password: fd.get("password")
      });
      if (error) {
        $("gateMsg").textContent = error.message;
        $("gateMsg").className = "gate-msg err";
      }
    });
    gate.classList.add("show");
  }

  function showDenied() {
    gateContent.innerHTML = `
      <div class="gate-deny">
        This account isn't a manager.<br>
        Backlot is restricted to manager accounts.<br><br>
        <button class="signout-btn" id="denySignOut">Sign out</button>
      </div>
    `;
    $("denySignOut").addEventListener("click", doSignOut);
    gate.classList.add("show");
  }

  function hideGate() { gate.classList.remove("show"); }

  async function doSignOut() {
    try { await sb.auth.signOut(); } catch (e) { console.warn("[Backlot] signOut error", e); }
    // Belt and suspenders: clear any persisted Supabase session
    Object.keys(localStorage)
      .filter(k => k.startsWith("sb-") && k.endsWith("-auth-token"))
      .forEach(k => localStorage.removeItem(k));
    location.replace(location.pathname);
  }
  $("signOutBtn").addEventListener("click", doSignOut);

  // ---- tab switching ----
  document.querySelectorAll(".tab").forEach(t => {
    t.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
      document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + t.dataset.view));
      if (t.dataset.view === "map") setTimeout(() => map && map.invalidateSize(), 50);
    });
  });

  // ---- data loaders ----
  function startOfToday() {
    const d = new Date(); d.setHours(0,0,0,0); return d;
  }
  function fmtHM(d) {
    return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  async function loadFleetStats() {
    const since = startOfToday().toISOString();
    const { data: records, error } = await sb
      .from("records").select("user_id,status,no_tag,ts")
      .gte("ts", since);
    if (error) { console.warn(error); return; }

    const total = records.length;
    const driverIds = new Set(records.map(r => r.user_id));
    const noTag = records.filter(r => r.no_tag).length;
    $("statCars").textContent = total;
    $("statDrivers").textContent = driverIds.size;
    $("statNoTag").textContent = noTag;
    $("statCarsSub").textContent = "since midnight";
    $("statDriversSub").textContent = driverIds.size === 1 ? "driver clocked in" : "drivers clocked in";
    $("statNoTagSub").textContent = total ? `${Math.round((noTag/total)*100)}% of total` : "";

    // Cars/hour — divide by hours elapsed since midnight (min 1)
    const hours = Math.max(1, (Date.now() - startOfToday().getTime()) / 3600000);
    $("statRate").textContent = (total / hours).toFixed(1);

    // Status breakdown
    const byStatus = {};
    records.forEach(r => { byStatus[r.status] = (byStatus[r.status] || 0) + 1; });
    const entries = Object.entries(byStatus).sort((a,b) => b[1]-a[1]);
    const max = entries[0]?.[1] || 1;
    const bd = $("statusBreakdown");
    if (entries.length === 0) {
      bd.innerHTML = `<div class="empty">No cars logged yet today.</div>`;
    } else {
      bd.innerHTML = entries.map(([s,c]) => `
        <div class="bar-row">
          <div class="label">${s}</div>
          <div class="bar"><span style="width:${(c/max)*100}%"></span></div>
          <div class="count">${c}</div>
        </div>
      `).join("");
    }
  }

  async function loadLeaderboard() {
    const since = startOfToday().toISOString();
    const { data: records, error } = await sb
      .from("records").select("user_id,ts")
      .gte("ts", since);
    if (error) { console.warn(error); return; }

    const byUser = {};
    records.forEach(r => {
      const u = byUser[r.user_id] || (byUser[r.user_id] = { count: 0, first: r.ts, last: r.ts });
      u.count++;
      if (r.ts < u.first) u.first = r.ts;
      if (r.ts > u.last) u.last = r.ts;
    });

    const userIds = Object.keys(byUser);
    let names = {};
    if (userIds.length) {
      const { data: profiles } = await sb.from("profiles").select("id,display_name,role").in("id", userIds);
      (profiles || []).forEach(p => { names[p.id] = p.display_name || "(no name)"; });
    }

    const rows = Object.entries(byUser)
      .map(([id, u]) => ({ id, name: names[id] || "Driver", ...u }))
      .sort((a, b) => b.count - a.count);

    const el = $("leaderboard");
    if (rows.length === 0) {
      el.innerHTML = `<div class="empty">No drivers active yet today.</div>`;
      return;
    }
    el.innerHTML = rows.map((r, i) => {
      const hours = Math.max(1/60, (new Date(r.last) - new Date(r.first)) / 3600000);
      const rate = (r.count / hours).toFixed(1);
      return `
        <div class="leader-row">
          <div class="leader-rank ${i === 0 ? 'gold' : ''}">${i+1}</div>
          <div>
            <div class="leader-name">${escapeHtml(r.name)}</div>
            <div class="leader-sub">${rate}/hr · last ${fmtHM(new Date(r.last))}</div>
          </div>
          <div class="leader-count" style="margin-left:auto">${r.count}</div>
        </div>
      `;
    }).join("");
  }

  // ---- map ----
  let map = null;
  let markerLayer = null;
  function initMap() {
    if (map) return;
    map = L.map("map", { zoomControl: true }).setView([38.18, -85.74], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "© OpenStreetMap"
    }).addTo(map);
    markerLayer = L.layerGroup().addTo(map);
  }
  async function loadMap() {
    initMap();
    const since = startOfToday().toISOString();
    const { data: records, error } = await sb
      .from("records").select("lat,lng,user_id,status,ts,serial_id")
      .gte("ts", since).not("lat", "is", null);
    if (error) { console.warn(error); return; }
    markerLayer.clearLayers();
    const bounds = [];
    records.forEach(r => {
      const m = L.circleMarker([r.lat, r.lng], {
        radius: 6, color: "#00a651", weight: 2, fillColor: "#00a651", fillOpacity: 0.7
      }).bindPopup(`<b>${r.serial_id}</b><br>${r.status}<br>${fmtHM(new Date(r.ts))}`);
      m.addTo(markerLayer);
      bounds.push([r.lat, r.lng]);
    });
    if (bounds.length > 1) map.fitBounds(bounds, { padding: [30, 30] });
    else if (bounds.length === 1) map.setView(bounds[0], 15);
  }

  // ---- announcements ----
  async function loadAnnouncements() {
    const { data, error } = await sb.from("announcements").select("*").order("created_at", { ascending: false }).limit(50);
    const el = $("annList");
    if (error) { el.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`; return; }
    if (!data || !data.length) { el.innerHTML = `<div class="empty">No announcements yet.</div>`; return; }
    el.innerHTML = data.map(a => `
      <div class="ann-item">
        <button class="del" data-id="${a.id}">delete</button>
        <div class="meta">${new Date(a.created_at).toLocaleString()}</div>
        <div class="body">${escapeHtml(a.body)}</div>
      </div>
    `).join("");
    el.querySelectorAll(".del").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete this announcement?")) return;
        await sb.from("announcements").delete().eq("id", btn.dataset.id);
        loadAnnouncements();
      });
    });
  }

  $("annForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const body = (fd.get("body") || "").trim();
    if (!body) return;
    const user = (await sb.auth.getUser()).data.user;
    const { error } = await sb.from("announcements").insert({ author_id: user.id, body });
    if (error) { alert(error.message); return; }
    e.target.reset();
    loadAnnouncements();
  });

  // ---- extra-driver requests ----
  async function loadEdrList() {
    const { data, error } = await sb
      .from("extra_driver_requests")
      .select("*, extra_driver_responses(response,driver_id)")
      .order("created_at", { ascending: false }).limit(20);
    const el = $("edrList");
    if (error) { el.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`; return; }
    if (!data || !data.length) { el.innerHTML = `<div class="empty">No open requests.</div>`; return; }
    el.innerHTML = data.map(r => {
      const responses = r.extra_driver_responses || [];
      const yes = responses.filter(x => x.response === "yes").length;
      const no = responses.filter(x => x.response === "no").length;
      return `
        <div class="edr-item">
          <div class="row"><div>${new Date(r.shift_time).toLocaleString()}</div><div class="status">${r.status}</div></div>
          <div class="row"><div>${r.needed_count} needed${r.duration_minutes ? ` · ${r.duration_minutes} min` : ""}</div><div>${escapeHtml(r.note || "")}</div></div>
          <div class="responses">✅ ${yes} accepted · ❌ ${no} declined</div>
        </div>
      `;
    }).join("");
  }

  $("edrForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const user = (await sb.auth.getUser()).data.user;
    const payload = {
      manager_id: user.id,
      shift_time: new Date(fd.get("shift_time")).toISOString(),
      needed_count: parseInt(fd.get("needed_count"), 10),
      duration_minutes: fd.get("duration_minutes") ? parseInt(fd.get("duration_minutes"), 10) : null,
      note: (fd.get("note") || "").trim() || null
    };
    const { error } = await sb.from("extra_driver_requests").insert(payload);
    if (error) { alert(error.message); return; }
    e.target.reset();
    loadEdrList();
  });

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // ---- refresh + realtime ----
  let refreshTimer = null;
  function refreshAll() {
    loadFleetStats();
    loadLeaderboard();
    loadMap();
    loadAnnouncements();
    loadEdrList();
  }

  function startRefreshing() {
    refreshAll();
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(refreshAll, 30000);

    // Realtime: any change to records, announcements, or EDR triggers an immediate refresh
    sb.channel("backlot-live")
      .on("postgres_changes", { event: "*", schema: "public", table: "records" }, () => { loadFleetStats(); loadLeaderboard(); loadMap(); })
      .on("postgres_changes", { event: "*", schema: "public", table: "announcements" }, loadAnnouncements)
      .on("postgres_changes", { event: "*", schema: "public", table: "extra_driver_requests" }, loadEdrList)
      .on("postgres_changes", { event: "*", schema: "public", table: "extra_driver_responses" }, loadEdrList)
      .subscribe();
  }

  // ---- auth boot ----
  async function checkAuth() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { showSignIn(); return; }
    const { data: profile, error } = await sb.from("profiles").select("role,display_name").eq("id", session.user.id).maybeSingle();
    if (error || !profile) { showSignIn({ text: "Profile load failed: " + (error?.message || "not found"), kind: "err" }); return; }
    if (profile.role !== "manager") { showDenied(); return; }
    hideGate();
    startRefreshing();
  }

  sb.auth.onAuthStateChange(() => checkAuth());
  checkAuth();
})();
</script>
</body>
</html>
