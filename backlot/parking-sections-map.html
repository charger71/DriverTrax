<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backlot — Parking Sections</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' https://unpkg.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="./styles.css" />
<link rel="stylesheet" href="./map-tool.css" />
</head>
<body>
<div class="bl-mt-app">
  <header class="bl-mt-header">
    <h1>Backlot<span>·</span>Parking Sections</h1>
    <div class="bl-mt-meta" id="header-meta">— lot boundaries</div>
  </header>
  <div class="bl-mt-main">
    <div class="bl-mt-map" id="map"></div>
    <aside class="bl-mt-panel">
      <div class="bl-mt-list" id="section-list"></div>
      <div class="bl-mt-box">
        <div class="bl-mt-box-title">Selected section — export boundary</div>
        <div class="bl-seg bl-mt-seg" role="tablist" aria-label="Export format">
          <button type="button" class="bl-seg-btn is-active" data-fmt="geojson">GeoJSON</button>
          <button type="button" class="bl-seg-btn" data-fmt="sql">SQL insert</button>
        </div>
        <pre class="bl-mt-code" id="coords-text">Click a section on the map or list.</pre>
        <button type="button" class="bl-btn bl-btn--primary bl-btn--sm bl-btn--block is-hidden" id="copy-btn">Copy</button>
      </div>
      <div class="bl-mt-box">
        <div class="bl-mt-box-title">Retag historical drop-offs</div>
        <p class="bl-mt-box-hint">Run after adding or moving a polygon. Re-checks every drop-off's GPS against the current sections and writes back to <code>records</code>. Idempotent.</p>
        <button type="button" class="bl-btn bl-btn--secondary bl-btn--sm bl-btn--block" id="retag-btn">Copy retag SQL</button>
      </div>
    </aside>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="parking-sections-map.js"></script>
</body>
</html>
